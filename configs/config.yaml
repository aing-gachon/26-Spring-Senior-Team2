# 실험 환경 및 하이퍼파라미터 설정 (DDQN 기반)

env:
  seed: 42
  device: "cuda"

data:
  raw_img_dir: "data/raw"
  csv_path: "data/Data_Entry_2017.csv"
  processed_dir: "data/processed"
  batch_size: 32
  num_workers: 4
  img_size: [224, 224] # MONAI 전처리 기준 해상도

rl:
  gamma: 0.99
  lr: 0.0001
  total_episodes: 1000
  target_update_freq: 50
  
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995

  per_alpha: 0.6
  per_beta: 0.4
  buffer_size: 50000

paths:
  checkpoint_dir: "checkpoints/"
  log_dir: "logs/"
