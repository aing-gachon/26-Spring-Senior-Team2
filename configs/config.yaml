experiment_name: "BicDRL_ResNet50_Default"

data:
  csv_path: "data/Data_Entry_2017.csv"
  image_dir: "data/raw/"
  image_size: 224

agent:
  backbone: "resnet50"
  num_classes: 2      # Default: binary classification (Pneumothorax vs Normal)
  gamma_factor: 1.0   # Base factor for adaptive gamma_k
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  target_update_freq: 1000
  buffer_capacity: 50000
  batch_size: 32

train:
  learning_rate: 0.0001
  num_episodes: 100
  steps_per_episode: 500 
  save_dir: "checkpoints/"
