# BicDRL-Reproduction Configuration

paths:
  data_dir: "./data"
  raw_image_dir: "./data/raw"
  csv_file: "./data/Data_Entry_2017_v2020.csv"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

hyperparameters:
  batch_size: 64
  learning_rate: 0.00025
  gamma: 0.1
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  buffer_capacity: 10000
  target_update_interval: 1000

env:
  image_size: 224
  target_disease: "Nodule"          # 향후 'Pneumonia' 등 이 값만 변경하면 자동으로 실험이 변경됨
  normal_disease: "No Finding"      # 다수 레이블
  target_disease_count: 5           # 가져올 목표 질병 갯수
  normal_ratio: 50                  # 타겟 질병 개수 대비 일반 이미지 배수 비율
  num_episodes: 5                   # 테스트용: 원래 5000번이나 CPU 환경 테스트를 위해 5번으로 축소
  max_steps_per_episode: 50

model:
  backbone: "resnet50"
  num_classes: 2 # 0: No Finding, 1: Nodule
